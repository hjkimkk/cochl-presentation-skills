<g id="layer-text-content">
<text x="790" y="46" font-family="'Courier New', Courier, monospace" font-size="9" font-weight="400" fill="#566B62" text-anchor="end" letter-spacing="1.5">PRODUCT BROCHURE — 2026</text>
<line x1="52" y1="72" x2="790" y2="72" stroke="#CFE6D8" stroke-width="1"></line>
<text x="52" y="128" font-family="'Courier New', Courier, monospace" font-size="9" font-weight="400" fill="#0FA068" text-anchor="start" letter-spacing="1.5">01 — OVERVIEW</text>
<text x="52" y="170" font-family="Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#0E2620" text-anchor="start">From raw sound to</text>
<text x="52" y="210" font-family="Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#0E2620" text-anchor="start">real decisions.</text>
<text x="52" y="268" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#566B62" text-anchor="start">Cochl listens the way people do — recognising the events</text>
<text x="52" y="287" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#566B62" text-anchor="start">behind a sound rather than just its volume. One deep-learning</text>
<text x="52" y="306" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#566B62" text-anchor="start">model identifies gunshots, glass-breaks, alarms and machinery</text>
<text x="52" y="325" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#566B62" text-anchor="start">faults directly on the device.</text>
<text x="52" y="344" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#566B62" text-anchor="start"></text>
<text x="52" y="363" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#566B62" text-anchor="start">No cloud round-trip. No recordings leaving the sensor.</text>
<g id="stats">
